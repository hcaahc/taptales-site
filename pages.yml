# Pages CMS configuration — https://pagescms.org/docs/configuration/
media:
  input: media
  output: /media

content:
  - name: products
    label: Games & apps
    type: file
    path: products.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: type
        label: Type
        type: select
        default: game
        options:
          values:
            - { name: game, label: Game }
            - { name: app, label: App }
            - { name: media, label: Media / video }
      - name: description
        label: Short description (1–2 sentences)
        type: text
        options:
          maxlength: 160
      - name: icon
        label: Game icon (square, 512×512)
        type: image
      - name: cover
        label: Key art (optional, landscape 16:9, e.g. 1600×900)
        type: image
      - name: accent
        label: Block colour
        type: select
        default: purple
        options:
          values:
            - { name: purple, label: Electric Purple }
            - { name: violet, label: Violet }
            - { name: magenta, label: Magenta }
            - { name: yellow, label: Tap Yellow }
      - name: links
        label: Download links
        type: object
        list: true
        fields:
          - name: platform
            label: Store / platform
            type: select
            default: google-play
            options:
              values:
                - { name: google-play, label: Google Play }
                - { name: app-store, label: App Store }
                - { name: steam, label: Steam }
                - { name: youtube, label: YouTube }
                - { name: tiktok, label: TikTok }
                - { name: facebook, label: Facebook }
                - { name: website, label: Website }
          - name: url
            label: Link
            type: string
            required: true

  - name: site
    label: Site settings
    type: file
    path: site.json
    format: json
    fields:
      - name: email
        label: Contact email
        type: string
        required: true
      - name: socials
        label: Social & store links (Follow section)
        type: object
        list: true
        fields:
          - name: platform
            label: Platform
            type: select
            options:
              values:
                - { name: app-store, label: App Store }
                - { name: google-play, label: Google Play }
                - { name: instagram, label: Instagram }
                - { name: facebook, label: Facebook }
          - name: label
            label: Name
            type: string
          - name: subtitle
            label: Small text
            type: string
          - name: url
            label: Link
            type: string
            required: true

  - name: legal
    label: Legal pages
    type: group
    items:
      - name: terms
        label: Terms & Conditions
        type: file
        path: terms.json
        format: json
        operations: { create: false, delete: false, rename: false }
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: updated
            label: Last updated
            type: date
            options:
              format: yyyy-MM-dd
          - name: intro
            label: Intro
            type: text
          - name: body
            label: Content (use Heading 2 for each numbered section)
            type: rich-text
            options:
              format: markdown
              media: false
      - name: privacy
        label: Privacy Policy
        type: file
        path: privacy.json
        format: json
        operations: { create: false, delete: false, rename: false }
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: updated
            label: Last updated
            type: date
            options:
              format: yyyy-MM-dd
          - name: intro
            label: Intro
            type: text
          - name: body
            label: Content (use Heading 2 for each numbered section)
            type: rich-text
            options:
              format: markdown
              media: false
      - name: policy
        label: Product & Service Policy
        type: file
        path: policy.json
        format: json
        operations: { create: false, delete: false, rename: false }
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: updated
            label: Last updated
            type: date
            options:
              format: yyyy-MM-dd
          - name: intro
            label: Intro
            type: text
          - name: body
            label: Content (use Heading 2 for each numbered section)
            type: rich-text
            options:
              format: markdown
              media: false
